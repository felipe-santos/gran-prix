[workspace]
members = ["gran-prix-wasm", "tools/train"]
resolver = "2"

[package]
name = "gran-prix"
version = "0.1.0"
edition = "2021"

[dependencies]
ndarray = { version = "0.17", features = ["serde"] }
ndarray-rand = "0.14"
rand = "0.8"
rand_chacha = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
typetag = "0.2"
rayon = { version = "1.10", optional = true }
thiserror = "1.0"
anyhow = "1.0"
cudarc = { version = "0.19.6", default-features = false, features = ["std", "driver", "nvrtc", "fallback-dynamic-loading", "cuda-12080"], optional = true }

[features]
default = []
cuda = ["dep:cudarc"]
rayon = ["dep:rayon", "ndarray/rayon"]
