# Continuous integration for pull requests and feature branches.
# `main` is covered by deploy.yml (GitHub Pages), so pushes to main do not run this workflow.
name: CI

on:
  pull_request:
  push:
    branches-ignore: ["main"]

permissions:
  contents: read

# One run per event and branch; a newer commit cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # Cargo workspace (core crate at the repo root + gran-prix-wasm) on the native target.
  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler. Install exactly that version (rustup does not
      # reliably auto-install it) together with the wasm32 target the file lists.
      - name: Install pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
      - name: Test workspace (core + WASM bridge)
        run: cargo test --workspace

  # Size-optimized WASM build with a size budget (scripts/check-wasm-size.mjs).
  # The packages carry a BUILD_INFO.json stamp (source hash) that the js-tests job checks.
  wasm:
    name: WASM build and size budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      # rust-toolchain.toml pins the compiler. Install exactly that version (rustup does not
      # reliably auto-install it) together with the wasm32 target the file lists.
      - name: Install pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: wasm
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - name: Build WASM (web and nodejs) into packages/wasm/dist
        run: >
          node scripts/build-wasm.mjs --target both
          --web-out packages/wasm/dist/web --node-out packages/wasm/dist/node
      - name: Check WASM size budget
        run: node scripts/check-wasm-size.mjs packages/wasm/dist/web/gran_prix_wasm_bg.wasm
      - name: Upload web package for demo-web
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist-web
          path: packages/wasm/dist/web
          if-no-files-found: error
          retention-days: 7
      - name: Upload nodejs package for the smoke tests
        uses: actions/upload-artifact@v4
        with:
          name: wasm-dist-node
          path: packages/wasm/dist/node
          if-no-files-found: error
          retention-days: 7

  # Runs the bridge from Node against the package built by the wasm job
  # (smoke-test.mjs and seeded-init-check.mjs read packages/wasm/dist/node by default).
  node-smoke:
    name: Node smoke test
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download nodejs package
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist-node
          path: packages/wasm/dist/node
      - name: Smoke test
        run: node demo-web/scripts/smoke-test.mjs
      - name: Seeded initialization check
        run: node demo-web/scripts/seeded-init-check.mjs

  # demo-web depends on the workspace package `@gran-prix/wasm` (packages/wasm/dist/web, built by the wasm job).
  demo-web:
    name: demo-web build
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download web package
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist-web
          path: packages/wasm/dist/web
      # pnpm version comes from "packageManager" in the root package.json (single source of truth).
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter demo-web build

  # The JS package tests, which need the WASM packages, the Chromium that playwright-core
  # drives (features, labels, cli) and the gp-train binary (cli `train` stage and the
  # cross-runtime check). Nothing here is built by the other jobs except the WASM artifacts.
  js-tests:
    name: JS tests (Chromium, WASM, gp-train)
    needs: wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download web package
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist-web
          path: packages/wasm/dist/web
      - name: Download nodejs package
        uses: actions/download-artifact@v4
        with:
          name: wasm-dist-node
          path: packages/wasm/dist/node
      # pnpm version comes from "packageManager" in the root package.json (single source of truth).
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      # rust-toolchain.toml pins the compiler. Install exactly that version (rustup does not
      # reliably auto-install it) together with the wasm32 target the file lists.
      - name: Install pinned Rust toolchain
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel" --profile minimal --target wasm32-unknown-unknown
      # gp-train is built here instead of being passed as an artifact: the `rust` job only builds
      # the debug profile (cargo test), so its target dir has no release binary to upload, and a
      # second job would pay for its own checkout, toolchain install and cache restore plus an
      # artifact round trip. With the cache warm this step is incremental.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: js-tests
      - name: Build gp-train (release)
        run: cargo build --release -p gp-train
      # features, labels and cli launch Chromium through playwright-core. packages/features finds
      # ~/.cache/ms-playwright/chromium-<revision>/chrome-linux64/chrome (newest revision wins),
      # which is where `playwright-core install` puts the revision pinned by the locked
      # playwright-core version. The cache is keyed on the lockfile, so a version bump reinstalls.
      - name: Cache Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Install Chromium
        run: pnpm --filter @gran-prix/features exec playwright-core install --with-deps chromium
      - name: Check that the Chromium is where packages/features looks
        run: ls -l ~/.cache/ms-playwright/chromium-*/chrome-linux64/chrome
      # @gran-prix/wasm is excluded: its dist comes from the artifacts above (no wasm-pack here).
      - name: Build packages and tools
        run: pnpm -r --filter "./packages/*" --filter "./tools/*" --filter "!@gran-prix/wasm" build
      - name: Test JS packages
        run: pnpm test:js
      # Cross-runtime parity (gp-train package vs WASM Trainer vs infer-ts) and the stale-WASM
      # detection. GP_TRAIN_REQUIRE_NODE=1 turns "prerequisites missing or WASM build stale"
      # from a skip into a failure.
      - name: Cross-runtime check (Rust, WASM, TS)
        env:
          GP_TRAIN_REQUIRE_NODE: "1"
        run: |
          cargo test --release -p gp-train --test package_e2e golden_reproduces_in_wasm_and_infer_ts -- --nocapture
          cargo test --release -p gp-train --test stale_wasm
