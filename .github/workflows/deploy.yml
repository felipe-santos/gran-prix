# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  # deploy-pages looks up the uploaded "github-pages" artifact through the Actions API
  # (listWorkflowRunArtifacts), which needs actions: read on the GITHUB_TOKEN.
  actions: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in the root package.json (single source of truth).
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
      # pnpm 11 needs Node >= 22.13.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # demo-web depends on the workspace package `@gran-prix/wasm` (packages/wasm/dist/web).
      # Nothing generated is committed, so the WASM is built here (same steps as the CI `wasm` job).
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: .
          key: wasm
      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.14.0
      - name: Build WASM into packages/wasm/dist
        run: >
          node scripts/build-wasm.mjs --target web
          --web-out packages/wasm/dist/web
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build
        run: pnpm --filter demo-web build
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          # Upload the build output from the demo-web/dist directory
          path: './demo-web/dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
