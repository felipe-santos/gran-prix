[package]
name = "gran-prix-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
console_error_panic_hook = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.4"
serde_json = "1.0"
ndarray = { version = "0.15", features = ["serde"] }
getrandom = { version = "0.2", features = ["js"] }
js-sys = "0.3"

[dependencies.gran-prix]
path = "../"
default-features = false

# Used by `wasm-pack build --release` (scripts/build-wasm.mjs). The rest of the
# size profile (opt-level=z, lto, codegen-units=1, panic=abort) is applied through
# CARGO_PROFILE_RELEASE_* env vars in that script, so it survives a Cargo workspace.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz"]
